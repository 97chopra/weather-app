<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    
</head>
<body>

    <!-- ─── Search Bar ──────────────────────────────────────────── -->
    <div class="search-bar">
        <input type="text" id="city-input" placeholder="Search City..." />
        <button id="search-btn">Search</button>
    </div>

    <!-- ─── Weather Alert Box ───────────────────────────────────── -->
    <!-- FIX 2: Removed the hardcoded alert text "⚠ Heavy rain expected at 4pm"
                That was static fake content. The JS will now write real
                error messages into this box via alertBox.textContent.
                Also added style="display:none" so it stays hidden until
                an actual error occurs — before this it was always visible. -->
    <div class="alert-box" id="alert-box" style="display: none;"></div>

    <!-- ─── Main Weather Card ───────────────────────────────────── -->
    <div class="weather-card" id="weather-card">
        <div class="left">
            <p class="city-name" id="city-name">Loading...</p>

            
            <h1 class="temperature" id="temperature">--°C</h1>

            
            <p class="local-time" id="local-time">--</p>
        </div>
        <div class="right">
            <p class="condition" id="condition">--</p>
            <p class="extra" id="humidity">H: --%</p>
            <p class="extra" id="wind">W: -- km/h</p>
        </div>
    </div>

    <!-- ─── Hourly Forecast ─────────────────────────────────────── -->
    <div class="hourly-section">
        <h3>Hourly Forecast</h3>

        
        <div class="hourly-row" id="hourly-list"></div>
    </div>

    <!-- ─── 7-Day Forecast ──────────────────────────────────────── -->
    <div class="forecast-section">
        <h3>7-Day Forecast</h3>

        <!-- FIX 6: Same as hourly — removed all 7 hardcoded <div class="day-card">
                    blocks (Mon 17°, Tue 20°... all fake static values).
                    The JS renderDailyForecast() function fills this in from
                    real API data.
                    Changed id from "forecast-row" to "daily-list" to match
                    what the JS file expects. -->
        <div class="forecast-row" id="daily-list"></div>
    </div>

    <!-- ─── Script ──────────────────────────────────────────────── -->
    
    <script src="script.js"></script>

    
</body>
</html>
