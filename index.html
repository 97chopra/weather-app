<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    
</head>
<body>

    <!-- ─── Search Bar ──────────────────────────────────────────── -->
    <div class="search-bar">
        <input type="text" id="city-input" placeholder="Search City..." />
        <button id="search-btn">Search</button>
    </div>

    <!-- ─── Weather Alert Box ───────────────────────────────────── -->
    
    <div class="alert-box" id="alert-box" style="display: none;"></div>

    <!-- ─── Main Weather Card ───────────────────────────────────── -->
    <div class="weather-card" id="weather-card">
        <div class="left">
            <p class="city-name" id="city-name">Loading...</p>

            
            <h1 class="temperature" id="temperature">--°C</h1>

            
            <p class="local-time" id="local-time">--</p>
        </div>
        <div class="right">
            <p class="condition" id="condition">--</p>
            <p class="extra" id="humidity">H: --%</p>
            <p class="extra" id="wind">W: -- km/h</p>
        </div>
    </div>

    <!-- ─── Hourly Forecast ─────────────────────────────────────── -->
    <div class="hourly-section">
        <h3>Hourly Forecast</h3>

        
        <div class="hourly-row" id="hourly-list"></div>
    </div>

    <!-- ─── 7-Day Forecast ──────────────────────────────────────── -->
    <div class="forecast-section">
        <h3>7-Day Forecast</h3>

        
        <div class="forecast-row" id="daily-list"></div>
    </div>

    <!-- ─── Script ──────────────────────────────────────────────── -->
    
    <script src="script.js"></script>

    
</body>
</html>
