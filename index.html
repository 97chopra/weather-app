<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css" />
        </head><head></head>
        <body>
            <!-- Search Bar-->
             <div class="search-bar">
                <input type="text" id="city-input" placeholder="Search City..." />
                <button id="search-btn">Search</button>
             </div>

             <!---Weather Alert-->
             <div class="alert-box" id="alert-box">
                ⚠ Heavy rain expected at 4pm
             </div>

             <!--Main weather Card-->
             <div class="weather-card" id="weather-card">
                <div class="left">
                    <p class = "city-name" id="city-name">Auckland NewZealand</p>
                    <hi class="teamperature" id="temperature">18°C</hi>
                </div>
                <div class="right">
                    <p class="condition" id="condition">Cloudy</p>
                    <p class="extra" id="humidity">H: 72%</p>
                    <p class="extra" id="wind">W: 14 km/h</p>
                </div>
             </div>
             <!-- Hourly Forecast -->
  <div class="hourly-section">
    <h3>Hourly Forecast</h3>
    <div class="hourly-row" id="hourly-row">

      <div class="hour-card">
        <p class="hour-time">Now</p>
        <p class="hour-temp">18°</p>
      </div>

      <div class="hour-card">
        <p class="hour-time">3 PM</p>
        <p class="hour-temp">17°</p>
      </div>

      <div class="hour-card">
        <p class="hour-time">6 PM</p>
        <p class="hour-temp">15°</p>
      </div>

      <div class="hour-card">
        <p class="hour-time">9 PM</p>
        <p class="hour-temp">13°</p>
      </div>

    </div>
  </div>

        </body>
    </head>
</html>
